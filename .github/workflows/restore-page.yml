name: restore-page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[restore-page]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unstable phase scripts from entry page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="phase7-goals.js"></script>\n','')
          s=s.replace('<script src="phase8-budget.js"></script>\n','')
          p.write_text(s)
          PY
      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '[restore-page] Restaurar carga estable' || exit 0
          git push
      - name: Cleanup workflow
        run: |
          git rm .github/workflows/restore-page.yml || true
          git commit -m '[restore-page] Limpiar workflow temporal' || true
          git push || true

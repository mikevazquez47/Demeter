name: Activate Phase 7
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, 'Phase 7 integrated')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add custom goals script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="phase7-goals.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Phase 7 integrated' || exit 0
          git push

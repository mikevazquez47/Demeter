name: Aplicar UX de movimientos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/merge-movement-form.py'
      - '.github/workflows/apply-movement-form.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar cambio
        run: python scripts/merge-movement-form.py
      - name: Commit actualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git add index.html
          git commit -m 'Unificar registro de movimientos'
          git push

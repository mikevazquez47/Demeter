name: Corregir sintaxis de Demeter Finance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corregir etiqueta duplicada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section id="finanzas"<section id="finanzas" class="view">'
          new = '<section id="finanzas" class="view">'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Sintaxis corregida.')
          else:
              print('No se encontró la secuencia defectuosa; no se modifica el archivo.')
          PY
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
          else
            git commit -m 'Corregir pantalla en blanco'
            git push
          fi

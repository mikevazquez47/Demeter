name: Corregir sintaxis de Demeter Finance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corregir pantalla en blanco
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ('<section id="finanzas"<section id="finanzas" class="view">', '<section id="finanzas" class="view">'),
              ("$('transferDate').value=s", "if($('transferDate'))$('transferDate').value=s"),
          ]
          changed = False
          for old, new in fixes:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Correcciones aplicadas.')
          else:
              print('No se encontraron correcciones pendientes.')
          PY
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
          else
            git commit -m 'Corregir inicializacion de movimientos'
            git push
          fi

name: patch-goals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[goals-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch goals logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old=re.search(r'function goalData\(liq,debt\)\{.*?\}\}function renderGoals',s)
          if not old:
              raise SystemExit('goalData block not found')
          new="""function goalData(liq,debt){const investmentAccounts=accountsData.filter(a=>a.type==='asset'&&/invers|investment/i.test(a.name||''));const invested=investmentAccounts.reduce((s,a)=>s+Number(a.balance||0),0)||200000;const investmentTarget=1460000;const investmentPct=Math.min(100,invested/investmentTarget*100);return[{title:'Salir de deudas',priority:'Prioridad 1',priorityClass:'high',value:money(debt),target:'$0',pct:debt>0?0:100,next:debt?'Reducir primero los pasivos antes de acelerar metas secundarias.':'Deuda liquidada. Mantén el control.'},{title:'Fondo de emergencia',priority:'Prioridad 2',priorityClass:'',value:'$0',target:'6 meses de gastos fijos',pct:0,next:'El objetivo se definirá con tus gastos fijos reales; no vamos a inventar una cifra.'},{title:'Capital invertido',priority:'Construcción',priorityClass:'low',value:money(invested),target:'Capital 2029',pct:investmentPct,next:'El progreso se calcula con el capital invertido frente al objetivo. La liquidez disponible ya no se presenta como si fuera inversión.'},{title:'Coche ≤ $200,000',priority:'Última prioridad',priorityClass:'low',value:'$0',target:'$200,000',pct:0,next:'No usar dinero destinado a deuda, emergencia o preservación de inversiones.'}]}function renderGoals"""
          s=s[:old.start()]+new+s[old.end()-len('function renderGoals'):]
          s=s.replace('<span>Liquidez actual</span><b>${money(liq)}</b>','<span>Capital de la meta</span><b>${g.value}</b>')
          s=s.replace("<button class=\"goal-add\" onclick=\"toast('La creación de metas personalizadas será la siguiente ampliación.')\">＋ Próximamente: crear meta personalizada</button>","")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '[goals-patch] Conectar metas con capital real' || exit 0
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-goals.yml || true
          git commit -m '[goals-patch] Limpiar workflow temporal' || true
          git push || true

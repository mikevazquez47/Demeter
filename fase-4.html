<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Centro de Control · Estudio</title><style>:root{--bg:#F8F7F4;--ink:#25242A;--primary:#56345C;--lav:#A982B5;--green:#7AA68A;--amber:#D99A3D;--red:#C85C5C;--surface:#fff;--soft:#EEECE8;--line:#dfdcd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.brand{display:flex;gap:11px;align-items:center}.mark{width:40px;height:40px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:900;color:#777;text-transform:uppercase;margin:0 0 5px}.brand strong{font-size:18px;display:block}.brand small{color:#777}.top h1{font-size:30px;margin:22px 0 5px;letter-spacing:-.04em}.sub{color:#777;font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.scope{display:flex;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:15px}.scope button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:850;color:#777}.scope button.active{background:var(--primary);color:#fff}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap}.tabs button.active{background:#eee8f0;color:var(--primary);border-color:#d3c4d7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 6px 22px rgba(37,36,42,.045)}.metric span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;font-weight:800}.metric strong{display:block;font-size:27px;margin-top:7px}.metric small{color:#777}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.head h2,.head h3{margin:0}.head p{margin:4px 0;color:#777;font-size:13px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ebe8e3}.row:last-child{border-bottom:0}.row b{display:block}.row small{display:block;color:#777;margin-top:3px}.good{color:var(--green)}.bad{color:var(--red)}.status{font-size:10px;font-weight:900;text-transform:uppercase;padding:5px 8px;border-radius:999px}.active{background:#e8f1ea;color:#4f7d5d}.paused{background:#f7edda;color:#996b20}.inactive{background:#eee;color:#666}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.toolbar input{width:min(360px,100%);border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pkg h3{margin:0}.pkg .price{font-size:25px;font-weight:900;margin:12px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{background:var(--soft);border-radius:999px;padding:6px 9px;font-size:11px}.empty{padding:28px;text-align:center;color:#777;background:var(--bg);border-radius:14px}.modal{position:fixed;inset:0;background:rgba(37,36,42,.45);display:grid;place-items:center;padding:16px;z-index:10}.modalbox{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px;padding:20px}.modalbox h2{margin:0}.form{display:grid;gap:10px;margin-top:15px}.form label{font-size:12px;font-weight:800;color:#555}.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}.form textarea{min-height:80px}.actions{display:flex;gap:8px;margin-top:4px}.actions>*{flex:1}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px}.loginbox h1{margin:12px 0 5px}.error{color:#9b4141;background:#f8e9e9;padding:11px;border-radius:11px;font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:620px){.shell{padding:18px 12px 45px}.top{display:block}.top-actions{margin-top:14px}.grid,.grid2,.cards{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) auto}.row>span:last-child{grid-column:1/-1}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://gconmsfozomwfisnmgdq.supabase.co',SB_KEY='sb_publishable_ZLXQ1aAgucleTv3g6nfOuQ_zB4T6Acd';const db=supabase.createClient(SB_URL,SB_KEY);let user=null,tab='resumen',students=[],packages=[],payments=[],transactions=[],accounts=[];const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City'}).format(new Date());
function loginView(){root.innerHTML='<div class="login"><section class="loginbox"><div class="brand"><span class="mark">M</span><div><strong>Mi Centro</strong><small>de Control</small></div></div><p class="eyebrow" style="margin-top:25px">ACCESO PRIVADO</p><h1>Bienvenido de nuevo</h1><p class="sub">Módulo privado de Demeter Fitness.</p><form id="login" class="form"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="pass" type="password" required autocomplete="current-password"></label><button class="btn primary">Iniciar sesión</button></form><div id="loginError"></div></section></div>';login.onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)loginError.innerHTML='<div class="error">No se pudo iniciar sesión.</div>';else{user=r.data.user;app()}}}
function app(){root.innerHTML='<main class="shell"><header class="top"><div><div class="brand"><span class="mark">M</span><div><strong>Mi Centro</strong><small>de Control</small></div></div><h1>Demeter Fitness</h1><p class="sub">Operación del estudio · Alumnas, paquetes, pagos y finanzas.</p></div><div class="top-actions"><button class="btn" id="refresh">Actualizar</button><button class="btn" id="logout">Salir</button></div></header><div class="scope"><button class="active">Estudio</button><button disabled>Personal</button></div><nav class="tabs">${[['resumen','Resumen'],['alumnas','Alumnas'],['paquetes','Paquetes'],['pagos','Pagos'],['movimientos','Finanzas']].map(x=>`<button data-tab="${x[0]}">${x[1]}</button>`).join('')}</nav><section id="content"></section><div id="modal"></div></main>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});refresh.onclick=load;logout.onclick=async()=>{await db.auth.signOut();location.reload()};load()}
async function load(){const [s,p,pa,t,a]=await Promise.all([db.from('students').select('*').eq('user_id',user.id).order('name'),db.from('packages').select('*').eq('user_id',user.id).order('name'),db.from('payments').select('*,students(name)').eq('user_id',user.id).order('payment_date',{ascending:false}).limit(100),db.from('transactions').select('id,amount,type,concept,transaction_date,account_id,accounts(name)').eq('user_id',user.id).eq('area','studio').order('transaction_date',{ascending:false}).limit(100),db.from('accounts').select('*').eq('user_id',user.id).eq('area','studio').eq('type','asset').order('name')]);const bad=[s,p,pa,t,a].find(x=>x.error);if(bad){content.innerHTML='<div class="card"><div class="error">No se pudieron cargar los datos: '+esc(bad.error.message)+'</div></div>';return}students=s.data||[];packages=p.data||[];payments=pa.data||[];transactions=t.data||[];accounts=a.data||[];render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({resumen:summary,alumnas:studentPage,paquetes:packagePage,pagos:paymentPage,movimientos:financePage}[tab])()}
function summary(){const m=today().slice(0,7),active=students.filter(x=>x.status==='active').length,inc=transactions.filter(x=>x.type==='income'&&String(x.transaction_date).startsWith(m)).reduce((a,x)=>a+Number(x.amount),0),exp=transactions.filter(x=>x.type==='expense'&&String(x.transaction_date).startsWith(m)).reduce((a,x)=>a+Number(x.amount),0),paid=payments.filter(x=>String(x.payment_date).startsWith(m)).reduce((a,x)=>a+Number(x.amount),0);content.innerHTML='<div class="grid"><article class="card metric"><span>Alumnas activas</span><strong>'+active+'</strong><small>Estado actual</small></article><article class="card metric"><span>Pagos recibidos</span><strong class="good">'+money(paid)+'</strong><small>Este mes</small></article><article class="card metric"><span>Ingresos del estudio</span><strong class="good">'+money(inc)+'</strong><small>Movimientos reales</small></article><article class="card metric"><span>Resultado mensual</span><strong>'+money(inc-exp)+'</strong><small>Ingresos − gastos</small></article></div><div class="grid2"><article class="card"><div class="head"><div><p class="eyebrow">OPERACIÓN</p><h2>Acciones rápidas</h2></div></div><div class="actions"><button class="btn primary" data-action="student-new">Nueva alumna</button><button class="btn" data-action="payment-new">Registrar pago</button></div></article><article class="card"><div class="head"><div><p class="eyebrow">ACTIVIDAD</p><h2>Últimos pagos</h2></div></div>${payments.slice(0,5).map(p=>'<div class="row"><span><b>'+esc(p.students?.name||'Alumna')+'</b><small>'+esc(p.payment_date)+' · '+esc(p.payment_method||'Sin método')+'</small></span><strong class="good">'+money(p.amount)+'</strong></div>').join('')||'<div class="empty">No hay pagos registrados todavía.</div>'}</article></div>';bindActions()}
function studentPage(){content.innerHTML='<div class="toolbar"><input id="search" placeholder="Buscar alumna…"><button class="btn primary" data-action="student-new">+ Nueva alumna</button></div><div class="card">'+(students.length?students.map(s=>'<div class="row"><span><b>'+esc(s.name)+'</b><small>'+esc(s.phone||'Sin teléfono')+' · Ingreso '+esc(s.joined_at||'—')+'</small></span><span class="status '+esc(s.status)+'">'+({active:'Activa',paused:'Pausada',inactive:'Inactiva'})[s.status]+'</span><span><button class="btn" data-action="student-edit" data-id="'+s.id+'">Editar</button> <button class="btn" data-action="student-pay" data-id="'+s.id+'">Pago</button> <button class="btn" data-action="student-archive" data-id="'+s.id+'">Archivar</button></span></div>').join(''):'<div class="empty">No hay alumnas registradas todavía.</div>')+'</div>';bindActions();search.oninput=()=>document.querySelectorAll('.row').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(search.value.toLowerCase()))}
function packagePage(){content.innerHTML='<div class="toolbar"><div><p class="eyebrow">CATÁLOGO</p><h2>Paquetes</h2></div><button class="btn primary" data-action="package-new">+ Nuevo paquete</button></div><div class="cards">'+(packages.length?packages.map(p=>'<article class="card pkg"><div class="head"><h3>'+esc(p.name)+'</h3><span class="status '+(p.active?'active':'inactive')+'">'+(p.active?'Activo':'Inactivo')+'</span></div><div class="price">'+money(p.price)+'</div><p>'+esc(p.description||'Sin descripción')+'</p><div class="chips"><span class="chip">'+(p.class_count??'—')+' clases</span><span class="chip">'+(p.validity_days??'—')+' días</span></div><button class="btn" data-action="package-edit" data-id="'+p.id+'">Editar</button></article>').join(''):'<div class="empty">No hay paquetes registrados.</div>')+'</div>';bindActions()}
function paymentPage(){content.innerHTML='<div class="toolbar"><div><p class="eyebrow">COBRANZA</p><h2>Pagos</h2><p class="sub">Cada pago se registra también como ingreso del estudio.</p></div><button class="btn primary" data-action="payment-new">+ Registrar pago</button></div><div class="card">'+(payments.length?payments.map(p=>'<div class="row"><span><b>'+esc(p.students?.name||'Alumna')+'</b><small>'+esc(p.payment_date)+' · '+esc(p.payment_method||'Sin método')+'</small></span><strong class="good">'+money(p.amount)+'</strong><span>'+esc(p.period_start||'—')+' → '+esc(p.period_end||'—')+'</span></div>').join(''):'<div class="empty">No hay pagos registrados todavía.</div>')+'</div>';bindActions()}
function financePage(){const m=today().slice(0,7),inc=transactions.filter(x=>x.type==='income'&&String(x.transaction_date).startsWith(m)).reduce((a,x)=>a+Number(x.amount),0),exp=transactions.filter(x=>x.type==='expense'&&String(x.transaction_date).startsWith(m)).reduce((a,x)=>a+Number(x.amount),0);content.innerHTML='<div class="grid"><article class="card metric"><span>Ingresos del mes</span><strong class="good">'+money(inc)+'</strong></article><article class="card metric"><span>Gastos del mes</span><strong class="bad">'+money(exp)+'</strong></article><article class="card metric"><span>Resultado</span><strong>'+money(inc-exp)+'</strong></article><article class="card metric"><span>Cuentas</span><strong>'+accounts.length+'</strong></article></div><div class="grid2"><article class="card"><div class="head"><div><p class="eyebrow">CUENTAS</p><h2>Dinero del estudio</h2></div><button class="btn" data-action="account-new">+ Cuenta</button></div>'+ (accounts.length?accounts.map(a=>'<div class="row"><span><b>'+esc(a.name)+'</b><small>Activo</small></span><strong class="good">'+money(a.balance)+'</strong></div>').join(''):'<div class="empty">No hay cuentas. Crea una cuenta antes de registrar movimientos.</div>')+'</article><article class="card"><div class="head"><div><p class="eyebrow">MOVIMIENTOS</p><h2>Historial</h2></div><button class="btn primary" data-action="transaction-new">+ Movimiento</button></div>'+ (transactions.length?transactions.slice(0,20).map(t=>'<div class="row"><span><b>'+esc(t.concept||'Movimiento')+'</b><small>'+esc(t.transaction_date)+' · '+esc(t.accounts?.name||'Cuenta')+'</small></span><strong class="'+(t.type==='income'?'good':'bad')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</strong></div>').join(''):'<div class="empty">No hay movimientos del estudio todavía.</div>')+'</article></div>';bindActions()}
function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id))}
async function action(a,id){if(a==='student-new')return studentForm();if(a==='student-edit')return studentForm(students.find(x=>x.id===id));if(a==='student-pay')return paymentForm(students.find(x=>x.id===id));if(a==='student-archive'){if(confirm('¿Archivar esta alumna?')){const r=await db.from('students').update({status:'inactive'}).eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);await load()}return}if(a==='package-new')return packageForm();if(a==='package-edit')return packageForm(packages.find(x=>x.id===id));if(a==='payment-new')return paymentForm();if(a==='transaction-new')return transactionForm();if(a==='account-new')return accountForm()}
function openModal(title,body){modal.innerHTML='<div class="modal"><section class="modalbox"><div class="head"><h2>'+title+'</h2><button class="btn" id="close">×</button></div>'+body+'</section></div>';close.onclick=()=>modal.innerHTML='';return modal.querySelector('form')}
function studentForm(s={}){const f=openModal(s.id?'Editar alumna':'Nueva alumna','<form class="form"><label>Nombre<input name="name" required value="'+esc(s.name)+'"></label><label>Teléfono<input name="phone" value="'+esc(s.phone)+'"></label><label>Fecha de ingreso<input name="joined_at" type="date" value="'+esc(s.joined_at||today())+'"></label><label>Estado<select name="status"><option value="active" '+(s.status==='active'?'selected':'')+'>Activa</option><option value="paused" '+(s.status==='paused'?'selected':'')+'>Pausada</option><option value="inactive" '+(s.status==='inactive'?'selected':'')+'>Inactiva</option></select></label><label>Notas<textarea name="notes">'+esc(s.notes)+'</textarea></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=s.id?await db.from('students').update(d).eq('id',s.id).eq('user_id',user.id):await db.from('students').insert({...d,user_id:user.id});if(r.error)return alert(r.error.message);modal.innerHTML='';await load()}}
function packageForm(p={}){const f=openModal(p.id?'Editar paquete':'Nuevo paquete','<form class="form"><label>Nombre<input name="name" required value="'+esc(p.name)+'"></label><label>Descripción<input name="description" value="'+esc(p.description)+'"></label><label>Precio<input name="price" type="number" min="0" step=".01" required value="'+(p.price??'')+'"></label><label>Número de clases<input name="class_count" type="number" min="0" value="'+(p.class_count??'')+'"></label><label>Vigencia (días)<input name="validity_days" type="number" min="0" value="'+(p.validity_days??'')+'"></label><label>Estado<select name="active"><option value="true" '+(p.active!==false?'selected':'')+'>Activo</option><option value="false" '+(p.active===false?'selected':'')+'>Inactivo</option></select></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.price=Number(d.price);d.class_count=d.class_count?Number(d.class_count):null;d.validity_days=d.validity_days?Number(d.validity_days):null;d.active=d.active==='true';const r=p.id?await db.from('packages').update(d).eq('id',p.id).eq('user_id',user.id):await db.from('packages').insert({...d,user_id:user.id});if(r.error)return alert(r.error.message);modal.innerHTML='';await load()}}
function paymentForm(pre){const f=openModal('Registrar pago','<form class="form"><label>Alumna<select name="student_id" required><option value="">Selecciona</option>'+students.map(s=>'<option value="'+s.id+'" '+(pre?.id===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label>Paquete<select name="package_id"><option value="">Sin paquete</option>'+packages.filter(p=>p.active).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+money(p.price)+'</option>').join('')+'</select></label><label>Cuenta de ingreso<select name="account_id" required><option value="">Selecciona</option>'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+money(a.balance)+'</option>').join('')+'</select></label><label>Monto<input name="amount" type="number" min="0.01" step=".01" required></label><label>Fecha<input name="payment_date" type="date" value="'+today()+'" required></label><label>Método<select name="payment_method"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></label><label>Periodo inicio<input name="period_start" type="date"></label><label>Periodo fin<input name="period_end" type="date"></label><label>Nota<textarea name="note"></textarea></label><button class="btn primary">Registrar pago</button></form>');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);const pkg=packages.find(p=>p.id===d.package_id);const start=d.period_start||d.payment_date;const expiration=d.period_end||(pkg?.validity_days?new Date(new Date(start+'T12:00:00').getTime()+pkg.validity_days*86400000).toISOString().slice(0,10):null);let sp=null;if(pkg){const r=await db.from('student_packages').insert({user_id:user.id,student_id:d.student_id,package_id:pkg.id,price:d.amount,start_date:start,expiration_date:expiration,status:'active'}).select('id').single();if(r.error)return alert(r.error.message);sp=r.data.id}const tx=await db.from('transactions').insert({user_id:user.id,area:'studio',account_id:d.account_id,amount:d.amount,type:'income',concept:'Pago alumna',transaction_date:d.payment_date});if(tx.error)return alert(tx.error.message);const p=await db.from('payments').insert({user_id:user.id,student_id:d.student_id,student_package_id:sp,amount:d.amount,payment_date:d.payment_date,payment_method:d.payment_method,period_start:start,period_end:expiration,note:d.note,financial_transaction_id:tx.data?.[0]?.id||null});if(p.error){await db.from('transactions').delete().eq('id',tx.data?.[0]?.id||'').eq('user_id',user.id);return alert(p.error.message)}await db.from('accounts').update({balance:db.rpc}).eq('id','never');modal.innerHTML='';await load()}}
function accountForm(){const f=openModal('Nueva cuenta del estudio','<form class="form"><label>Nombre<input name="name" placeholder="Ej. Cuenta bancaria Demeter" required></label><label>Saldo inicial<input name="balance" type="number" step=".01" value="0" required></label><button class="btn primary">Crear cuenta</button></form>');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=await db.from('accounts').insert({user_id:user.id,area:'studio',type:'asset',name:d.name,balance:Number(d.balance),active:true});if(r.error)return alert(r.error.message);modal.innerHTML='';await load()}}
function transactionForm(){const f=openModal('Nuevo movimiento','<form class="form"><label>Tipo<select name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></label><label>Cuenta<select name="account_id" required>'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+money(a.balance)+'</option>').join('')+'</select></label><label>Monto<input name="amount" type="number" min="0.01" step=".01" required></label><label>Concepto<input name="concept" required></label><label>Fecha<input name="transaction_date" type="date" value="'+today()+'" required></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);const r=await db.from('transactions').insert({...d,user_id:user.id,area:'studio'});if(r.error)return alert(r.error.message);const delta=d.type==='income'?d.amount:-d.amount;const a=accounts.find(x=>x.id===d.account_id);if(a&&Number(a.balance)+delta<0)return alert('El saldo no puede quedar negativo.');if(a)await db.from('accounts').update({balance:Number(a.balance)+delta}).eq('id',a.id).eq('user_id',user.id);modal.innerHTML='';await load()}}
db.auth.getSession().then(r=>{if(r.data.session){user=r.data.session.user;app()}else loginView()});</script></body></html>

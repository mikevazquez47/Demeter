<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Centro de Control · Fase 4</title><style>:root{--bg:#F8F7F4;--ink:#25242A;--p:#56345C;--g:#7AA68A;--r:#C85C5C;--s:#fff;--l:#dfdcd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:28px 16px 50px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:13px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block}.brand small{color:#777}.ey{font-size:10px;letter-spacing:.12em;font-weight:900;color:#777;margin:22px 0 5px}.top h1{margin:0;font-size:30px;letter-spacing:-.04em}.sub{color:#777;font-size:13px}.btn{border:1px solid var(--l);background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--p);border-color:var(--p);color:#fff}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0 14px}.tabs button{border:1px solid var(--l);background:#fff;border-radius:11px;padding:10px 14px;font-weight:800;white-space:nowrap}.tabs button.on{background:#eee8f0;color:var(--p);border-color:#d3c4d7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:17px;box-shadow:0 6px 20px rgba(37,36,42,.04)}.metric span{font-size:10px;color:#777;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.metric strong{display:block;font-size:27px;margin-top:7px}.good{color:var(--g)}.bad{color:var(--r)}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ebe8e3}.row:last-child{border-bottom:0}.row b{display:block}.row small{display:block;color:#777;margin-top:3px}.status{font-size:10px;text-transform:uppercase;font-weight:900;padding:5px 8px;border-radius:999px}.status.active{background:#e8f1ea;color:#4f7d5d}.status.paused{background:#f7edda;color:#996b20}.status.inactive{background:#eee;color:#666}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.toolbar input{width:min(360px,100%);border:1px solid var(--l);border-radius:11px;padding:11px;background:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.price{font-size:25px;font-weight:900;margin:12px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#eeeae5;padding:6px 9px;border-radius:99px;font-size:11px}.empty{text-align:center;padding:25px;color:#777;background:var(--bg);border-radius:13px}.modal{position:fixed;inset:0;background:#25242a77;display:grid;place-items:center;padding:16px}.box{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px;padding:20px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:800;color:#555}.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--l);border-radius:10px;padding:11px;background:#fff}.form textarea{min-height:75px}.actions{display:flex;gap:8px;margin-top:4px}.actions>*{flex:1}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--l);border-radius:22px;padding:24px}.error{background:#f8e9e9;color:#9b4141;padding:10px;border-radius:10px;margin-top:10px;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:18px 12px}.top{display:block}.top h1{font-size:25px}.grid,.two,.cards{grid-template-columns:1fr}.top .btn{margin-top:14px}.toolbar{flex-direction:column}.toolbar input{width:100%}.row{grid-template-columns:minmax(0,1fr) auto}.row>span:last-child{grid-column:1/-1}}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://gconmsfozomwfisnmgdq.supabase.co',KEY='sb_publishable_ZLXQ1aAgucleTv3g6nfOuQ_zB4T6Acd',db=supabase.createClient(URL,KEY);let u,tab='resumen',S=[],P=[],PAY=[],T=[],A=[];const $=id=>document.getElementById(id),m=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x])),today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City'}).format(new Date());
function login(){root.innerHTML='<div class="login"><section class="loginbox"><div class="brand"><i class="mark">M</i><div><strong>Mi Centro</strong><small>de Control</small></div></div><p class="ey">ACCESO PRIVADO</p><h1>Demeter Fitness</h1><p class="sub">Fase 4 · operación del estudio</p><form id="lf" class="form"><label>Correo<input id="em" type="email" required></label><label>Contraseña<input id="pw" type="password" required></label><button class="btn primary">Entrar</button></form><div id="le"></div></section></div>';lf.onsubmit=async x=>{x.preventDefault();let r=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error)le.innerHTML='<div class="error">No se pudo iniciar sesión.</div>';else{u=r.data.user;app()}}}
function app(){root.innerHTML='<main class="wrap"><header class="top"><div><div class="brand"><i class="mark">M</i><div><strong>Mi Centro</strong><small>de Control</small></div></div><p class="ey">DEMETER FITNESS · FASE 4</p><h1>Operación del estudio</h1><p class="sub">Alumnas, paquetes, pagos y finanzas del estudio.</p></div><button class="btn" id="out">Salir</button></header><nav class="tabs">${[['resumen','Resumen'],['alumnas','Alumnas'],['paquetes','Paquetes'],['pagos','Pagos'],['finanzas','Finanzas']].map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join('')}</nav><section id="c"></section><div id="modal"></div></main>';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});out.onclick=async()=>{await db.auth.signOut();location.reload()};load()}
async function load(){const q=await Promise.all([db.from('students').select('*').eq('user_id',u.id).order('name'),db.from('packages').select('*').eq('user_id',u.id).order('name'),db.from('payments').select('*,students(name)').eq('user_id',u.id).order('payment_date',{ascending:false}),db.from('transactions').select('*,accounts(name)').eq('user_id',u.id).eq('area','studio').order('transaction_date',{ascending:false}),db.from('accounts').select('*').eq('user_id',u.id).eq('area','studio').eq('type','asset').order('name')]);let bad=q.find(x=>x.error);if(bad){c.innerHTML='<div class="card"><div class="error">'+e(bad.error.message)+'</div></div>';return}S=q[0].data||[];P=q[1].data||[];PAY=q[2].data||[];T=q[3].data||[];A=q[4].data||[];render()}
function render(){document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({resumen:sum,alumnas:students,paquetes:packages,pagos:payments,finanzas:finance}[tab])()}
function sum(){let mm=today().slice(0,7),inc=T.filter(x=>x.type==='income'&&String(x.transaction_date).startsWith(mm)).reduce((a,x)=>a+Number(x.amount),0),ex=T.filter(x=>x.type==='expense'&&String(x.transaction_date).startsWith(mm)).reduce((a,x)=>a+Number(x.amount),0);c.innerHTML='<div class="grid"><div class="card metric"><span>Alumnas activas</span><strong>'+S.filter(x=>x.status==='active').length+'</strong></div><div class="card metric"><span>Pagos del mes</span><strong class="good">'+m(PAY.filter(x=>String(x.payment_date).startsWith(mm)).reduce((a,x)=>a+Number(x.amount),0))+'</strong></div><div class="card metric"><span>Ingresos</span><strong class="good">'+m(inc)+'</strong></div><div class="card metric"><span>Resultado</span><strong>'+m(inc-ex)+'</strong></div></div><div class="two"><div class="card"><div class="head"><h2>Acciones</h2></div><div class="actions"><button class="btn primary" onclick="studentForm()">Nueva alumna</button><button class="btn" onclick="paymentForm()">Registrar pago</button></div></div><div class="card"><div class="head"><h2>Últimos pagos</h2></div>'+(PAY.slice(0,6).map(x=>'<div class="row"><span><b>'+e(x.students?.name||'Alumna')+'</b><small>'+e(x.payment_date)+' · '+e(x.payment_method||'')+'</small></span><strong class="good">'+m(x.amount)+'</strong></div>').join('')||'<div class="empty">No hay pagos registrados.</div>')+'</div></div>'}
function students(){c.innerHTML='<div class="toolbar"><input id="search" placeholder="Buscar alumna…"><button class="btn primary" onclick="studentForm()">+ Nueva alumna</button></div><div class="card">'+(S.map(x=>'<div class="row"><span><b>'+e(x.name)+'</b><small>'+e(x.phone||'Sin teléfono')+' · '+e(x.joined_at||'—')+'</small></span><span class="status '+e(x.status)+'">'+({active:'Activa',paused:'Pausada',inactive:'Inactiva'})[x.status]+'</span><span><button class="btn" onclick="studentForm(S.find(z=>z.id===\''+x.id+'\'))">Editar</button> <button class="btn" onclick="paymentForm(S.find(z=>z.id===\''+x.id+'\'))">Pago</button></span></div>').join('')||'<div class="empty">No hay alumnas registradas.</div>')+'</div>';search.oninput=()=>document.querySelectorAll('.row').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(search.value.toLowerCase()))}
function packages(){c.innerHTML='<div class="toolbar"><div><p class="ey">CATÁLOGO</p><h2>Paquetes</h2></div><button class="btn primary" onclick="packageForm()">+ Nuevo paquete</button></div><div class="cards">'+(P.map(x=>'<article class="card"><div class="head"><h3>'+e(x.name)+'</h3><span class="status '+(x.active?'active':'inactive')+'">'+(x.active?'Activo':'Inactivo')+'</span></div><div class="price">'+m(x.price)+'</div><p>'+e(x.description||'Sin descripción')+'</p><div class="chips"><span class="chip">'+(x.class_count??'—')+' clases</span><span class="chip">'+(x.validity_days??'—')+' días</span></div><button class="btn" onclick="packageForm(P.find(z=>z.id===\''+x.id+'\'))">Editar</button></article>').join('')||'<div class="empty">No hay paquetes.</div>')+'</div>'}
function payments(){c.innerHTML='<div class="toolbar"><div><p class="ey">COBRANZA</p><h2>Pagos</h2></div><button class="btn primary" onclick="paymentForm()">+ Registrar pago</button></div><div class="card">'+(PAY.map(x=>'<div class="row"><span><b>'+e(x.students?.name||'Alumna')+'</b><small>'+e(x.payment_date)+' · '+e(x.payment_method||'')+'</small></span><strong class="good">'+m(x.amount)+'</strong><span>'+e(x.period_start||'—')+' → '+e(x.period_end||'—')+'</span></div>').join('')||'<div class="empty">No hay pagos.</div>')+'</div>'}
function finance(){let mm=today().slice(0,7),inc=T.filter(x=>x.type==='income'&&String(x.transaction_date).startsWith(mm)).reduce((a,x)=>a+Number(x.amount),0),ex=T.filter(x=>x.type==='expense'&&String(x.transaction_date).startsWith(mm)).reduce((a,x)=>a+Number(x.amount),0);c.innerHTML='<div class="grid"><div class="card metric"><span>Ingresos</span><strong class="good">'+m(inc)+'</strong></div><div class="card metric"><span>Gastos</span><strong class="bad">'+m(ex)+'</strong></div><div class="card metric"><span>Resultado</span><strong>'+m(inc-ex)+'</strong></div><div class="card metric"><span>Liquidez</span><strong>'+m(A.reduce((a,x)=>a+Number(x.balance),0))+'</strong></div></div><div class="two"><div class="card"><div class="head"><h2>Cuentas</h2><button class="btn" onclick="accountForm()">+ Cuenta</button></div>'+(A.map(x=>'<div class="row"><span><b>'+e(x.name)+'</b></span><strong>'+m(x.balance)+'</strong></div>').join('')||'<div class="empty">No hay cuentas del estudio.</div>')+'</div><div class="card"><div class="head"><h2>Movimientos</h2><button class="btn primary" onclick="transactionForm()">+ Movimiento</button></div>'+(T.slice(0,30).map(x=>'<div class="row"><span><b>'+e(x.concept||'Movimiento')+'</b><small>'+e(x.transaction_date)+'</small></span><strong class="'+(x.type==='income'?'good':'bad')+'">'+(x.type==='income'?'+':'−')+m(x.amount)+'</strong></div>').join('')||'<div class="empty">No hay movimientos.</div>')+'</div></div>'}
function modal(title,body){modal.innerHTML='<div class="modal"><section class="box"><div class="head"><h2>'+title+'</h2><button class="btn" onclick="modal.innerHTML=\'\'">×</button></div>'+body+'</section></div>';return modal.querySelector('form')}
function studentForm(s={}){let f=modal(s.id?'Editar alumna':'Nueva alumna','<form class="form"><label>Nombre<input name="name" required value="'+e(s.name)+'"></label><label>Teléfono<input name="phone" value="'+e(s.phone)+'"></label><label>Fecha de ingreso<input name="joined_at" type="date" value="'+e(s.joined_at||today())+'"></label><label>Estado<select name="status"><option value="active" '+(s.status==='active'?'selected':'')+'>Activa</option><option value="paused" '+(s.status==='paused'?'selected':'')+'>Pausada</option><option value="inactive" '+(s.status==='inactive'?'selected':'')+'>Inactiva</option></select></label><label>Notas<textarea name="notes">'+e(s.notes)+'</textarea></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(new FormData(f));let r=s.id?await db.from('students').update(d).eq('id',s.id).eq('user_id',u.id):await db.from('students').insert({...d,user_id:u.id});if(r.error)return alert(r.error.message);modal.innerHTML='';load()}}
function packageForm(p={}){let f=modal(p.id?'Editar paquete':'Nuevo paquete','<form class="form"><label>Nombre<input name="name" required value="'+e(p.name)+'"></label><label>Descripción<input name="description" value="'+e(p.description)+'"></label><label>Precio<input name="price" type="number" min="0" step=".01" required value="'+(p.price??'')+'"></label><label>Número de clases<input name="class_count" type="number" min="0" value="'+(p.class_count??'')+'"></label><label>Vigencia (días)<input name="validity_days" type="number" min="0" value="'+(p.validity_days??'')+'"></label><label>Activo<select name="active"><option value="true" '+(p.active!==false?'selected':'')+'>Activo</option><option value="false" '+(p.active===false?'selected':'')+'>Inactivo</option></select></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(new FormData(f));d.price=Number(d.price);d.class_count=d.class_count?Number(d.class_count):null;d.validity_days=d.validity_days?Number(d.validity_days):null;d.active=d.active==='true';let r=p.id?await db.from('packages').update(d).eq('id',p.id).eq('user_id',u.id):await db.from('packages').insert({...d,user_id:u.id});if(r.error)return alert(r.error.message);modal.innerHTML='';load()}}
function paymentForm(s){let f=modal('Registrar pago','<form class="form"><label>Alumna<select name="student_id" required><option value="">Selecciona</option>'+S.map(x=>'<option value="'+x.id+'" '+(s?.id===x.id?'selected':'')+'>'+e(x.name)+'</option>').join('')+'</select></label><label>Paquete<select name="package_id"><option value="">Sin paquete</option>'+P.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+e(x.name)+' · '+m(x.price)+'</option>').join('')+'</select></label><label>Cuenta de ingreso<select name="account_id" required><option value="">Selecciona</option>'+A.map(x=>'<option value="'+x.id+'">'+e(x.name)+' · '+m(x.balance)+'</option>').join('')+'</select></label><label>Monto<input name="amount" type="number" min=".01" step=".01" required></label><label>Fecha<input name="payment_date" type="date" value="'+today()+'" required></label><label>Método<select name="payment_method"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></label><label>Inicio del periodo<input name="period_start" type="date"></label><label>Fin del periodo<input name="period_end" type="date"></label><label>Nota<textarea name="note"></textarea></label><button class="btn primary">Registrar pago</button></form>');f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);let r=await db.rpc('register_studio_payment',{p_student_id:d.student_id,p_package_id:d.package_id||null,p_account_id:d.account_id,p_amount:d.amount,p_payment_date:d.payment_date,p_payment_method:d.payment_method,p_period_start:d.period_start||null,p_period_end:d.period_end||null,p_note:d.note||null});if(r.error)return alert(r.error.message);modal.innerHTML='';load()}}
function accountForm(){let f=modal('Nueva cuenta del estudio','<form class="form"><label>Nombre<input name="name" required placeholder="Ej. Cuenta bancaria Demeter"></label><label>Saldo inicial<input name="balance" type="number" step=".01" value="0"></label><button class="btn primary">Crear cuenta</button></form>');f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(new FormData(f));let r=await db.from('accounts').insert({user_id:u.id,area:'studio',type:'asset',name:d.name,balance:Number(d.balance),active:true});if(r.error)return alert(r.error.message);modal.innerHTML='';load()}}
function transactionForm(){let f=modal('Nuevo movimiento','<form class="form"><label>Tipo<select name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></label><label>Cuenta<select name="account_id" required>'+A.map(x=>'<option value="'+x.id+'">'+e(x.name)+' · '+m(x.balance)+'</option>').join('')+'</select></label><label>Monto<input name="amount" type="number" min=".01" step=".01" required></label><label>Concepto<input name="concept" required></label><label>Fecha<input name="transaction_date" type="date" value="'+today()+'" required></label><button class="btn primary">Guardar</button></form>');f.onsubmit=async x=>{x.preventDefault();let d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);let a=A.find(z=>z.id===d.account_id),delta=d.type==='income'?d.amount:-d.amount;if(a&&Number(a.balance)+delta<0)return alert('La cuenta no tiene saldo suficiente.');let r=await db.rpc('register_studio_movement',{p_account_id:d.account_id,p_type:d.type,p_amount:d.amount,p_concept:d.concept,p_transaction_date:d.transaction_date});if(r.error)return alert(r.error.message);modal.innerHTML='';load()}}
db.auth.getSession().then(r=>r.data.session?(u=r.data.session.user,app()):login());</script></body></html>
